{{- if .Values.services.documentProcessor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-processor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.documentProcessor.replicas }}
  selector:
    matchLabels:
      {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "document-processor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventpulse.labels" . | nindent 8 }}
        {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "document-processor") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-kafka-topic
          image: {{ .Values.kafka.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ .Values.kafka.brokers }} --describe --topic {{ .Values.kafka.topic }} >/dev/null 2>&1; do echo "waiting for topic {{ .Values.kafka.topic }}"; sleep 3; done
      containers:
        - name: document-processor
          image: "{{ .Values.image.registry }}/{{ .Values.services.documentProcessor.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.documentProcessor.port }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_GROUP_ID
              value: document-processor
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: EMBEDDINGS_PROVIDER
              value: {{ .Values.embeddings.provider | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.embeddings.model | quote }}
            - name: EMBEDDING_DIMENSIONS
              value: {{ .Values.embeddings.dimensions | quote }}
            - name: EMBEDDINGS_TABLE
              value: {{ .Values.embeddings.table | quote }}
            {{- if .Values.embeddings.huggingfaceToken }}
            - name: HUGGINGFACEHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mcpName }}
                  key: huggingface-token
            {{- end }}
            {{- if .Values.embeddings.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mcpName }}
                  key: openai-api-key
            {{- end }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- if .Values.llm.openaiBaseUrl }}
            - name: OPENAI_API_BASE
              value: {{ .Values.llm.openaiBaseUrl | quote }}
            {{- end }}
            {{- if .Values.llm.googleApiKey }}
            - name: GOOGLE_API_KEY
              value: {{ .Values.llm.googleApiKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.services.documentProcessor.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: document-processor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "document-processor") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.documentProcessor.port }}
      targetPort: {{ .Values.services.documentProcessor.port }}
{{- end }}