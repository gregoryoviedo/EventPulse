{{- if .Values.services.ingestionGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.ingestionGateway.replicas }}
  selector:
    matchLabels:
      {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "ingestion-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventpulse.labels" . | nindent 8 }}
        {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "ingestion-gateway") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: {{ .Values.kafka.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server {{ .Values.kafka.brokers }} >/dev/null 2>&1; do echo "waiting for kafka"; sleep 3; done
      containers:
        - name: ingestion-gateway
          image: "{{ .Values.image.registry }}/{{ .Values.services.ingestionGateway.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.services.ingestionGateway.port }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.services.ingestionGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "ingestion-gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.ingestionGateway.port }}
      targetPort: {{ .Values.services.ingestionGateway.port }}
{{- end }}