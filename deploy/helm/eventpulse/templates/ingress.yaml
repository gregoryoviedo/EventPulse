{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventpulse-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    {{- if .Values.services.ingestionGateway.enabled }}
    - host: {{ .Values.ingress.hosts.ingestionGateway | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingestion-gateway
                port:
                  number: {{ .Values.services.ingestionGateway.port }}
    {{- end }}
    {{- if .Values.services.mcpServer.enabled }}
    - host: {{ .Values.ingress.hosts.mcpServer | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: {{ .Values.services.mcpServer.port }}
    {{- end }}
{{- end }}