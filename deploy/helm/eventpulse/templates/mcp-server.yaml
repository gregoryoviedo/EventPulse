{{- if .Values.services.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.mcpServer.replicas }}
  selector:
    matchLabels:
      {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "mcp-server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventpulse.labels" . | nindent 8 }}
        {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "mcp-server") | nindent 8 }}
    spec:
      containers:
        - name: mcp-server
          image: "{{ .Values.image.registry }}/{{ .Values.services.mcpServer.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
{{- end }}
