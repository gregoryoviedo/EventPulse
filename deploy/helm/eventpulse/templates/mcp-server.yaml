{{- if .Values.services.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.mcpServer.replicas }}
  selector:
    matchLabels:
      {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "mcp-server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventpulse.labels" . | nindent 8 }}
        {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "mcp-server") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range $ps := . }}
        - name: {{ $ps }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h {{ .Values.postgres.host }} -U {{ .Values.postgres.user }} >/dev/null 2>&1; do echo "waiting for postgres"; sleep 3; done
      containers:
        - name: mcp-server
          image: "{{ .Values.image.registry }}/{{ .Values.services.mcpServer.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.mcpServer.port }}
              name: mcp
          env:
            - name: HTTP_ADDR
              value: "{{ printf ":%v" .Values.services.mcpServer.port }}"
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: EMBEDDINGS_PROVIDER
              value: {{ .Values.embeddings.provider | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.embeddings.model | quote }}
            - name: EMBEDDING_DIMENSIONS
              value: {{ .Values.embeddings.dimensions | quote }}
            {{- if .Values.embeddings.huggingfaceToken }}
            - name: HUGGINGFACEHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mcpName }}
                  key: huggingface-token
            {{- end }}
            {{- if .Values.embeddings.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mcpName }}
                  key: openai-api-key
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
          readinessProbe:
            httpGet:
              path: /readyz
              port: mcp
          resources:
            {{- toYaml .Values.services.mcpServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "mcp-server") | nindent 4 }}
  ports:
    - port: {{ .Values.services.mcpServer.port }}
      targetPort: {{ .Values.services.mcpServer.port }}
{{- end }}