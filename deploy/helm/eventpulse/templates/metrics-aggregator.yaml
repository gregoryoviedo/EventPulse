{{- if .Values.services.metricsAggregator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-aggregator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.metricsAggregator.replicas }}
  selector:
    matchLabels:
      {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "metrics-aggregator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventpulse.labels" . | nindent 8 }}
        {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "metrics-aggregator") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-kafka-topic
          image: {{ .Values.kafka.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ .Values.kafka.brokers }} --describe --topic {{ .Values.kafka.topic }} >/dev/null 2>&1; do echo "waiting for topic {{ .Values.kafka.topic }}"; sleep 3; done
      containers:
        - name: metrics-aggregator
          image: "{{ .Values.image.registry }}/{{ .Values.services.metricsAggregator.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.services.metricsAggregator.port }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_GROUP_ID
              value: metrics-aggregator
            - name: HTTP_ADDR
              value: "{{ printf ":%v" .Values.services.metricsAggregator.port }}"
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
          resources:
            {{- toYaml .Values.services.metricsAggregator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-aggregator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eventpulse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eventpulse.selectorLabels" (dict "Release" .Release "component" "metrics-aggregator") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.metricsAggregator.port }}
      targetPort: {{ .Values.services.metricsAggregator.port }}
{{- end }}