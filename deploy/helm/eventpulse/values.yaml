# Default values for the eventpulse Helm chart.

image:
  registry: ghcr.io/eventpulse
  pullPolicy: IfNotPresent
  tag: "0.1.0"

namespace: eventpulse

services:
  ingestionGateway:
    enabled: true
    replicas: 1
    image: ingestion-gateway
    port: 8080
  documentProcessor:
    enabled: true
    replicas: 1
    image: document-processor
    port: 8000
  metricsAggregator:
    enabled: true
    replicas: 1
    image: metrics-aggregator
  mcpServer:
    enabled: true
    replicas: 1
    image: mcp-server

# External dependencies (provided out-of-cluster for dev; override for prod).
kafka:
  brokers: "kafka:9092"
postgres:
  host: "postgres"
  port: 5432
  database: "eventpulse"
  user: "eventpulse"
