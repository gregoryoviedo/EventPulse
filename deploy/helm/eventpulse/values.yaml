# Default values for the eventpulse Helm chart.

image:
  registry: ghcr.io/eventpulse
  pullPolicy: IfNotPresent
  tag: "0.1.0"

namespace: eventpulse

services:
  ingestionGateway:
    enabled: true
    replicas: 1
    image: ingestion-gateway
    port: 8080
  documentProcessor:
    enabled: true
    replicas: 1
    image: document-processor
    port: 8000
  metricsAggregator:
    enabled: true
    replicas: 1
    image: metrics-aggregator
  mcpServer:
    enabled: true
    replicas: 1
    image: mcp-server
    port: 8090
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# mcp-server RAG embedding configuration. The provider must match the one used
# by document-processor so the query vectors align with the indexed ones.
# huggingfaceToken/openaiApiKey are referenced from the secret below.
mcp:
  embeddingsProvider: huggingface
  embeddingModel: BAAI/bge-large-en-v1.5
  embeddingDimensions: 1024
  secretName: mcp-server-secret
  huggingfaceToken: ""
  openaiApiKey: ""

# External dependencies (provided out-of-cluster for dev; override for prod).
kafka:
  brokers: "kafka:9092"
postgres:
  host: "postgres"
  port: 5432
  database: "eventpulse"
  user: "eventpulse"
