apiVersion: v1
kind: Service
metadata:
  name: ingestion-gateway-nodeport
  namespace: eventpulse
  labels:
    app.kubernetes.io/part-of: eventpulse
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: eventpulse
    app.kubernetes.io/name: ingestion-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080