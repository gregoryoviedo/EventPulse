apiVersion: v1
kind: Service
metadata:
  name: mcp-server-nodeport
  namespace: eventpulse
  labels:
    app.kubernetes.io/part-of: eventpulse
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: eventpulse
    app.kubernetes.io/name: mcp-server
  ports:
    - name: mcp
      port: 8090
      targetPort: 8090
      nodePort: 30081