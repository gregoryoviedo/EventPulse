services:
  kafka:
    image: apache/kafka:latest
    # PLAINTEXT (kafka:9092) is the in-network listener used by the services.
    # EXTERNAL (localhost:29092) is published for tooling run on the host.
    ports:
      - "29092:29092"
    environment:
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      # Single-broker dev cluster: internal topics cannot be replicated.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eventpulse_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion-gateway:
    build:
      context: .
      dockerfile: deploy/docker/ingestion-gateway.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres

  document-processor:
    build:
      context: .
      dockerfile: deploy/docker/document-processor.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=raw.events
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=eventpulse_db
      # Set HUGGINGFACEHUB_API_TOKEN in your shell or in a root .env file for
      # the huggingface provider (the default). OPENAI_API_KEY/OPENAI_BASE_URL
      # are only needed if you switch to the openai provider. Use
      # EMBEDDINGS_PROVIDER=fake to run without one. EMBEDDING_DIMENSIONS must
      # match the vector(n) width of the table.
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-huggingface}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      # Generation model for POST /api/v1/generate. The huggingface provider is
      # the default; OPENAI_API_BASE/OPENAI_BASE_URL are optional overrides for
      # the openai provider.
      - LLM_PROVIDER=${LLM_PROVIDER:-huggingface}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

  metrics-aggregator:
    build:
      context: .
      dockerfile: deploy/docker/metrics-aggregator.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres

  mcp-server:
    build:
      context: .
      dockerfile: deploy/docker/mcp-server.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres

volumes:
  pgdata:
